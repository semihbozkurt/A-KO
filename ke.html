<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        
    <title>Kart Eşleştirme Oyunu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

            .light{background-color: whitesmoke !important; color: black !important;}
            .dark{background-color: black !important; color: white !important;}
            .show{display: none !important;}

            #heady{
                width: 100vw;
                height: 12vh;
                position: fixed;
                top: 0px;
                left: 0px;
                display: flex;
                justify-content: space-between; align-items: center;
                background-color: blueviolet;
                padding: 18px;
                z-index: 100;
            }
            #heady a{
                color: white;
                
            }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .skor-alani {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #7f8c8d;
        }

        /* 4x5 Izgara (Grid) Sistemi */
        #oyun-tahtasi {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 800px;
            perspective: 1000px;
        }

        /* 3B Kart Yapısı (Ana sayfanızdaki mantıkla aynı) */
        .oyun-karti {
            height: 140px;
            cursor: pointer;
            list-style: none;
        }

        .kart-ic {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        /* Kart tıklandığında dönecek sınıf */
        .dondurme {
            transform: rotateY(180deg);
        }

        .kart-on, .kart-arka {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Kartın Kapalı Yüzü (Oyuncu ilk bunu görür) */
        .kart-on {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-size: 2rem;
        }

        /* Kartın Açık Yüzü (Yazının yazdığı alan) */
        .kart-arka {
            background-color: #3498db;
            color: white;
            transform: rotateY(180deg);
            white-space: pre-wrap; /* Satır başlarını korur */
        }

        /* Eşleşen kartların yeşil olması için */
        .eslesti .kart-arka {
            background-color: #2ecc71 !important;
        }

        .btn-yeniden {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-yeniden:hover {
            background-color: #27ae60;
        }

        /* Telefonlar için ızgarayı 4 yerine 3 kolon yapabiliriz */
        @media (max-width: 500px) {
            #oyun-tahtasi {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
          <header id="heady">
            <div style="display: flex; gap: 25px; align-items: center;">
                <a style="text-decoration: none;" href="index.html"><h3>Web<strong>site</strong></h3></a>
                <div style="display: flex; gap: 15px;">
                    <a href="kaykay.html">Kaydırma</a>
                    <a href="ke.html">Kapalı eş</a>
                    <a href="ae.html">Açık eş</a>
                </div>
            </div>
            <button id="light-mode" onclick="light()" style="background-color: inherit; border-radius: 50%; border: none;">😁</button>
        </header>
        <br>
        <br>
        <br>        

    <h1>Hafıza Oyunu</h1>
    <div class="skor-alani">Bulunan Eşleşme: <span id="skor">0</span> / <span id="toplam-es">0</span></div>

    <div id="oyun-tahtasi"></div>

    <button class="btn-yeniden" onclick="oyunuBaslat()">Yeniden Başlat</button>

    <script>
        let acikKartlar = [];
        let bulunanEslesme = 0;
        let toplamEslesmeSayisi = 0;

        window.onload = function() {
            oyunuBaslat();
        };

        function oyunuBaslat() {
            // Değişkenleri sıfırla
            acikKartlar = [];
            bulunanEslesme = 0;
            document.getElementById('skor').innerText = "0";

            // 1. Ana sayfadaki localStorage hafızasından kartları çekiyoruz
            let anaKartlar = localStorage.getItem('kayitliKartlar') ? JSON.parse(localStorage.getItem('kayitliKartlar')) : [];
            
            if (anaKartlar.length === 0) {
                document.getElementById('oyun-tahtasi').innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Oynamak için önce ana sayfadan kart eklemelisiniz!</p>";
                return;
            }

            // 2. Kartları karıştır ve maksimum 10 tanesini seç
            let secilenKartlar = anaKartlar.sort(() => 0.5 - Math.random()).slice(0, 10);
            toplamEslesmeSayisi = secilenKartlar.length;
            document.getElementById('toplam-es').innerText = toplamEslesmeSayisi;

            // 3. Eşleştirme için havuz oluştur (Ön yüzleri ve arka yüzleri ayırıyoruz)
            let oyunHavuzu = [];
            secilenKartlar.forEach((kart, indeks) => {
                // Her karta ortak bir 'kartId' veriyoruz ki eşleşirken kontrol edebilelim
                oyunHavuzu.push({ metin: kart.onYuz, kartId: indeks });
                oyunHavuzu.push({ metin: kart.arkaYuz, kartId: indeks });
            });

            // 4. Havuzdaki ön ve arka yüzleri tamamen karmaşık hale getiriyoruz
            oyunHavuzu.sort(() => 0.5 - Math.random());

            // 5. Tahtayı temizle ve kartları yerleştir
            let tahta = document.getElementById('oyun-tahtasi');
            tahta.innerHTML = ""; 

            oyunHavuzu.forEach(kart => {
                let kartHTML = `
                    <div class="oyun-karti" data-id="${kart.kartId}" onclick="kartSec(this)">
                        <div class="kart-ic">
                            <div class="kart-on">?</div>
                            <div class="kart-arka">${kart.metin}</div>
                        </div>
                    </div>
                `;
                tahta.insertAdjacentHTML('beforeend', kartHTML);
            });
        }

        function kartSec(kartElemani) {
            // Zaten açık olan, eşleşmiş olan veya hafızada halihazırda 2 kart işlemdeyken tıklamayı engelle
            if (kartElemani.classList.contains('dondurme') || kartElemani.classList.contains('eslesti') || acikKartlar.length >= 2) return;

            // Kartı 3B olarak döndür
            kartElemani.querySelector('.kart-ic').classList.add('dondurme');
            acikKartlar.push(kartElemani);

            // Eğer iki kart açıldıysa eşleşme kontrolü yap
            if (acikKartlar.length === 2) {
                let kart1 = acikKartlar[0];
                let kart2 = acikKartlar[1];

                // data-id değerleri eşitse doğru eşleşmedir (Aynı kartın önü ve arkasıdır)
                if (kart1.getAttribute('data-id') === kart2.getAttribute('data-id')) {
                    // Başarılı eşleşme durumunda sınıfları güncelle
                    kart1.classList.add('eslesti');
                    kart2.classList.add('eslesti');
                    
                    bulunanEslesme++;
                    document.getElementById('skor').innerText = bulunanEslesme;
                    acikKartlar = [];

                    // Oyun bitti mi kontrolü
                    if (bulunanEslesme === toplamEslesmeSayisi) {
                        setTimeout(() => { alert("Tebrikler! Tüm kartları başarıyla eşleştirdiniz. 🎉"); }, 500);
                    }
                } else {
                    // Eşleşme yanlışsa 1 saniye beklet ve kartları geri kapat
                    setTimeout(() => {
                        kart1.querySelector('.kart-ic').classList.remove('dondurme');
                        kart2.querySelector('.kart-ic').classList.remove('dondurme');
                        acikKartlar = [];
                    }, 1000);
                }
            }
        }
    </script>

    <!--light mode-->
    <script>
            function light(){
                document.body.classList.toggle('light')
                document.getElementById('searcher').classList.toggle('dark')
            }
            document.getElementById('light-mode').addEventListener('contextmenu', (event)=>{
                event.preventDefault();
                let color= prompt('I dont know why you clicked that but now you get to chose the color'); 
                document.body.style.backgroundColor=color;
            })
        </script>
</body>
</html>

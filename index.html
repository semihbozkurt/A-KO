<html>
    <head>
        <title>Dictionary</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            body{background-color: black; box-sizing: border-box; padding: 0; margin: 0; overflow-x: hidden; color: white;}

            .light{background-color: whitesmoke !important; color: black !important;}
            .dark{background-color: black !important; color: white !important;}
            .show{display: none !important;}

            #heady{
                width: 100vw;
                height: 12vh;
                position: fixed;
                top: 0px;
                left: 0px;
                display: flex;
                justify-content: space-between; align-items: center;
                background-color: blueviolet;
                padding: 18px;
                z-index: 100;
            }
            #heady a{
                color: white;
                
            }

            #kartlar{
                display: grid;
                width: 100%;
                grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
                gap: 20px;
                justify-content: center; align-items: center; justify-items: center;
                list-style: none;
                margin: 0; padding: 0;
            }

            .kart{
                border: 1px solid black;
                border-radius: 15px;
                height: 250px; max-width: 230px; width: 100%;
                display: flex;
                justify-content: center; align-items: center;
                perspective: 500px;
            }
            .kart-iç{
                position: relative;
                height: 100%; width: 100%;
                transition: transform 0.6s;
                transform-style: preserve-3d;
                cursor: pointer;
            }
            .döndürme{transform: rotateY(180deg);}
            .kart-arka{
                position: absolute;
                padding: 3px;
                height: 100%; width: 100%;
                backface-visibility: hidden;
                border-radius: 15px; border: 2px solid blue;
                display: flex; justify-content: center; align-items: center;
                text-align: justify;
                background-color: purple; color: whitesmoke;
                transform: rotateY(180deg);
                white-space: pre-wrap;
            }
            .kart-ön{ 
                position: absolute;
                padding: 3px;
                border-radius: 15px; border: 2px solid red;
                height: 100%; width: 100%;
                backface-visibility: hidden;
                display: flex; justify-content: center; align-items: center;
                text-align: justify;
                background-color: orange; color: black;
            }
            .sil-btn {
                position: absolute;
                top: 10px;
                right: 10px;
                background-color: rgba(0, 0, 0, 0.2);
                color: white;
                border: none;
                border-radius: 50%;
                width: 25px;
                height: 25px;
                cursor: pointer;
                font-weight: bold;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: background 0.2s;
                z-index: 10; /* Butonun her zaman en üstte kalmasını sağlar */
            }

            .sil-btn:hover {
                background-color: red;
            }
            #kartEk{
                border: 1px solid black;
                border-radius: 15px;
                height: 250px; max-width: 230px; width: 100%;
                background-color: lightgreen;
                display: flex;
                justify-content: center; align-items: center;
            }

            #ekleyici{
                height: 70%; width: 70%; 
                background-color: wheat;
                display: flex; flex-direction: column;
                justify-content: space-between;
                padding: 70px; padding-left: 15px; padding-right: 15%;
                border: 2px solid brown; border-radius: 20px;
                position: fixed; top: 50%; left: 50%;
                transform: translate(-50%, -50%);
            }
            textarea{resize: none;}
        </style>
    </head>
    <body>
        
        <header id="heady">
            <div style="display: flex; gap: 25px; align-items: center;">
                <a style="text-decoration: none;" href="#"><h3>Web<strong>site</strong></h3></a>
                <div style="display: flex; gap: 15px;">
                    <a href="kaykay.html">Kaydırma</a>
                    <a href="ke.html">Kapalı eş</a>
                    <a href="ae.html">Açık eş</a>
                </div>
            </div>
            <button id="light-mode" onclick="light()" style="background-color: inherit; border-radius: 50%; border: none;">😁</button>
        </header>

        <div style="margin-top: 17vh; margin-left: 2vw; margin-right: 2vw; width: 96vw;">

            <h1>Kartların</h1>

            <ul id="kartlar">
                <li id="kartEk">
                    <button style="border: 1px solid gray; border-radius: 50%; height: 70px; width: 70px; background-color: lightblue;">+</button>
                </li>




            </ul>

            <!--ekleyici-->
            <div id="ekleyici" class="show">
                <div>
                <h5>Ön yazı:</h5>
                <input style="height: 70%; width: 110%;" type="text" id="önyaz" placeholder="feks: stemning"></div>
                <div style="width: 100%;">
                <h5>Arka yazı:</h5>
                <textarea spellcheck="false" style="height: 90%; width: 110%;" id="arkayaz" placeholder="feks: Atmosfer, (ortamın)Hava(sı)"></textarea></div>
                <div id="kappa" style="position: absolute; top: 3px; right: 12px; cursor: pointer;">x</div>
                <div style="border: 1px solid black; background-color: lightcoral; margin-top: 25px; width: 30%; display: flex; justify-content: center; cursor: pointer;" onclick="eklehadi()">Ekle</div>
            </div>

        </div>

        <br>
        <br>
      
        <!--light-mode-->
        <script>
            function light(){
                document.body.classList.toggle('light')
                document.getElementById('searcher').classList.toggle('dark')
            }
            document.getElementById('light-mode').addEventListener('contextmenu', (event)=>{
                event.preventDefault();
                let color= prompt('I dont know why you clicked that but now you get to chose the color'); 
                document.body.style.backgroundColor=color;
            })
        </script>

        <!--Kart ekleyen-->
        <script>
            // Sayfa tamamen yüklendiğinde çalışacak güvenli alan
window.onload = function() {
    // 1. Eski kartları hafızadan yükle
    kartlariYukle();

    // 2. Element seçimlerini buraya taşıdık, böylece HTML oluştuktan sonra butonlar bağlanır
    const kartEkBtn = document.getElementById('kartEk');
    const kappaBtn = document.getElementById('kappa');

    if (kartEkBtn) {
        kartEkBtn.onclick = () => { document.getElementById('ekleyici').classList.remove('show'); };
    }
    if (kappaBtn) {
        kappaBtn.onclick = () => { document.getElementById('ekleyici').classList.add('show'); };
    }
};

function eklehadi() {
    let önYazı = document.getElementById('önyaz').value;
    let arkaYazı = document.getElementById('arkayaz').value;

    if (önYazı === "" || arkaYazı === "") {
        alert("Lütfen kartın ön ve arka yazılarını doldurun!");
        return;
    }

    // 1. Kartı ekrana çiz
    kartCiz(önYazı, arkaYazı);

    // 2. Kartı yerel hafızaya (localStorage) kaydet
    kartKaydet(önYazı, arkaYazı);

    // Alan temizleme
    document.getElementById('önyaz').value = "";
    document.getElementById('arkayaz').value = "";
}

// Ekrana HTML basan fonksiyon
function kartCiz(on, arka) {
    let eklemeYeri = document.getElementById('kartlar');
    if (!eklemeYeri) return; // Eğer 'kartlar' listesi sayfada yoksa hata vermesini önler
    
    // HTML şablonu güncellendi: Metni rahat seçebilmek için <p> veya <span> içine almak en doğrusudur.
    let yeniKartHTML = `
        <li class="kart" onclick="döndür(this)">
            <div class="kart-iç">
                <div class="kart-ön">
                    <button class="sil-btn" onclick="kartSil(event, this)">X</button>
                    <span class="kart-metin">${on}</span>
                </div>
                <div class="kart-arka">${arka}</div>
            </div>
        </li>
    `;
    eklemeYeri.insertAdjacentHTML('beforeend', yeniKartHTML);
}

// Kartı hem ekrandan hem de hafızadan silen fonksiyon
function kartSil(olay, butonElemani) {
    olay.stopPropagation(); 

    if(!confirm("Bu kartı silmek istediğinize emin misiniz?")) return;

    let kartLi = butonElemani.closest('.kart');
    
    // HATA DÜZELTİLDİ: X harfiyle uğraşmamak için doğrudan .kart-metin sınıfındaki saf yazıyı alıyoruz
    let onYaziMetni = kartLi.querySelector('.kart-metin').innerText.trim();
    
    // Ekrandan (HTML'den) sil
    kartLi.remove();
    
    // LocalStorage'dan sil
    let kartlar = localStorage.getItem('kayitliKartlar') ? JSON.parse(localStorage.getItem('kayitliKartlar')) : [];
    
    // Silinen kart hariç diğer kartları filtrele
    kartlar = kartlar.filter(kart => kart.onYuz.trim() !== onYaziMetni);
    
    // Güncel listeyi hafızaya tekrar yaz
    localStorage.setItem('kayitliKartlar', JSON.stringify(kartlar));
}

// Yeni kartı localStorage'a dizi olarak ekleyen fonksiyon
function kartKaydet(on, arka) {
    let kartlar = localStorage.getItem('kayitliKartlar') ? JSON.parse(localStorage.getItem('kayitliKartlar')) : [];
    kartlar.push({ onYuz: on.trim(), arkaYuz: arka.trim() });
    localStorage.setItem('kayitliKartlar', JSON.stringify(kartlar));
}

// Sayfa yenilendiğinde hafızadaki tüm kartları ekrana basan fonksiyon
function kartlariYukle() {
    let kartlar = localStorage.getItem('kayitliKartlar') ? JSON.parse(localStorage.getItem('kayitliKartlar')) : [];
    kartlar.forEach(kart => {
        kartCiz(kart.onYuz, kart.arkaYuz);
    });
}

function döndür(kartElemani) {
    kartElemani.querySelector('.kart-iç').classList.toggle('döndürme');
}

        </script>
    </body>
</html>

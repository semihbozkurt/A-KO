<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıralı Kart Eşleştirme Oyunu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .light{background-color: whitesmoke !important; color: black !important;}
            .dark{background-color: black !important; color: white !important;}
            .show{display: none !important;}

            #heady{
                width: 100vw;
                height: 12vh;
                position: fixed;
                top: 0px;
                left: 0px;
                display: flex;
                justify-content: space-between; align-items: center;
                background-color: blueviolet;
                padding: 18px;
                z-index: 100;
            }
            #heady a{
                color: white;
                
            }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .skor-alani {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #7f8c8d;
        }

        .grup-baslik {
            width: 100%;
            max-width: 1000px;
            margin: 10px 0 5px 0;
            font-weight: bold;
            color: #34495e;
        }

        /* Büyük Ekranlarda 10 Sütunlu Yan Yana Grid Yapısı */
        .kart-satiri {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 25px;
        }

        .oyun-karti {
            height: 100px;
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            border: 2px solid transparent;
            transition: all 0.2s ease;
            white-space: pre-wrap; /* Satır başlarını korur */
        }

        /* Üst sıra (Ön Yüzler) Tasarımı */
        .kart-on-grup {
            background-color: #e67e22;
            color: white;
        }

        /* Alt sıra (Arka Yüzler) Tasarımı */
        .kart-arka-grup {
            background-color: #9b59b6;
            color: white;
        }

        /* Seçilen Kart Efekti */
        .secildi {
            border-color: #2c3e50;
            transform: scale(0.95);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            opacity: 0.8;
        }

        /* Başarıyla Eşleşen Kart Efekti */
        .eslesti {
            background-color: #2ecc71 !important;
            color: white !important;
            cursor: default;
            opacity: 0.6;
            transform: scale(0.98);
            box-shadow: none;
        }

        .btn-yeniden {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-yeniden:hover {
            background-color: #27ae60;
        }

        /* TELEFON VE KÜÇÜK EKRANLAR İÇİN RESPONSIVE DÜZEN 📱 */
        @media (max-width: 900px) {
            .grup-baslik {
                display: none; /* Mobilde başlıkları gizle */
            }
            
            /* Üst ve alt satırları birleştirip yan yana 2 sıra (2 kolon) yapıyoruz */
            .kart-satiri {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                margin-bottom: 10px;
            }
            
            /* İki grubu alt alta tek bir akışta birleştireceğimiz için containerları esnetiyoruz */
            #ust-satir, #alt-satir {
                display: contents; /* Grid bütünlüğünü korumak için kapsayıcıyı eritir */
            }
            
            #oyun-alani-wrapper {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                width: 100%;
                max-width: 500px;
            }

            .oyun-karti {
                height: 80px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

             <header id="heady">
            <div style="display: flex; gap: 25px; align-items: center;">
                <a style="text-decoration: none;" href="index.html"><h3>Web<strong>site</strong></h3></a>
                <div style="display: flex; gap: 15px;">
                    <a href="kaykay.html">Kaydırma</a>
                    <a href="ke.html">Kapalı eş</a>
                    <a href="ae.html">Açık eş</a>
                </div>
            </div>
            <button id="light-mode" onclick="light()" style="background-color: inherit; border-radius: 50%; border: none;">😁</button>
        </header>
        <br>
        <br>
        <br>   

    <h1>Kart Eşleştirme Düellosu</h1>
    <div class="skor-alani">Eşleşen: <span id="skor">0</span> / <span id="toplam-es">0</span></div>

    <!-- Mobil dönüşümün düzgün çalışması için wrapper eklendi -->
    <div id="oyun-alani-wrapper">
        <div class="grup-baslik">Ön Yüzler (Kavramlar)</div>
        <div id="ust-satir" class="kart-satiri"></div>

        <div class="grup-baslik">Arka Yüzler (Anlamları)</div>
        <div id="alt-satir" class="kart-satiri"></div>
    </div>

    <button class="btn-yeniden" onclick="oyunuBaslat()">Yeniden Başlat</button>

    <script>
        let secilenOnKart = null;
        let secilenArkaKart = null;
        let bulunanEslesme = 0;
        let toplamEslesmeSayisi = 0;

        window.onload = function() {
            oyunuBaslat();
        };

        function oyunuBaslat() {
            // Değişkenleri ve arayüzü sıfırla
            secilenOnKart = null;
            secilenArkaKart = null;
            bulunanEslesme = 0;
            document.getElementById('skor').innerText = "0";

            let anaKartlar = localStorage.getItem('kayitliKartlar') ? JSON.parse(localStorage.getItem('kayitliKartlar')) : [];
            
            if (anaKartlar.length === 0) {
                document.getElementById('ust-satir').innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Oynamak için önce ana sayfadan kart eklemelisiniz!</p>";
                return;
            }

            // 1. Rastgele maksimum 10 kart seç
            let secilenKartlar = anaKartlar.sort(() => 0.5 - Math.random()).slice(0, 10);
            toplamEslesmeSayisi = secilenKartlar.length;
            document.getElementById('toplam-es').innerText = toplamEslesmeSayisi;

            // 2. Ön yüz havuzu oluştur ve karıştır
            let onHavuzu = secilenKartlar.map((kart, indeks) => ({ metin: kart.onYuz, kartId: indeks }));
            onHavuzu.sort(() => 0.5 - Math.random());

            // 3. Arka yüz havuzu oluştur ve karıştır
            let arkaHavuzu = secilenKartlar.map((kart, indeks) => ({ metin: kart.arkaYuz, kartId: indeks }));
            arkaHavuzu.sort(() => 0.5 - Math.random());

            // 4. Üst satırı (Ön Yüzleri) çiz
            let ustSatir = document.getElementById('ust-satir');
            ustSatir.innerHTML = "";
            onHavuzu.forEach(kart => {
                ustSatir.insertAdjacentHTML('beforeend', `
                    <div class="oyun-karti kart-on-grup" data-id="${kart.kartId}" data-tip="on" onclick="kartSec(this)">
                        ${kart.metin}
                    </div>
                `);
            });

            // 5. Alt satırı (Arka Yüzleri) çiz
            let altSatir = document.getElementById('alt-satir');
            altSatir.innerHTML = "";
            arkaHavuzu.forEach(kart => {
                altSatir.insertAdjacentHTML('beforeend', `
                    <div class="oyun-karti kart-arka-grup" data-id="${kart.kartId}" data-tip="arka" onclick="kartSec(this)">
                        ${kart.metin}
                    </div>
                `);
            });
        }

        function kartSec(kartElemani) {
            // Zaten eşleşmiş karta tıklanmasını engelle
            if (kartElemani.classList.contains('eslesti')) return;

            const tip = kartElemani.getAttribute('data-tip');

            if (tip === 'on') {
                // Eğer zaten seçili bir ön kart varsa eski seçimi kaldır
                if (secilenOnKart) secilenOnKart.classList.remove('secildi');
                secilenOnKart = kartElemani;
                secilenOnKart.classList.add('secildi');
            } else if (tip === 'arka') {
                // Eğer zaten seçili bir arka kart varsa eski seçimi kaldır
                if (secilenArkaKart) secilenArkaKart.classList.remove('secildi');
                secilenArkaKart = kartElemani;
                secilenArkaKart.classList.add('secildi');
            }

            // Hem üstten hem alttan birer kart seçildiyse kontrol et
            if (secilenOnKart && secilenArkaKart) {
                let id1 = secilenOnKart.getAttribute('data-id');
                let id2 = secilenArkaKart.getAttribute('data-id');

                if (id1 === id2) {
                    // Doğru Eşleşme!
                    secilenOnKart.classList.remove('secildi');
                    secilenArkaKart.classList.remove('secildi');
                    secilenOnKart.classList.add('eslesti');
                    secilenArkaKart.classList.add('eslesti');

                    bulunanEslesme++;
                    document.getElementById('skor').innerText = bulunanEslesme;

                    // Seçimleri sıfırla
                    secilenOnKart = null;
                    secilenArkaKart = null;

                    if (bulunanEslesme === toplamEslesmeSayisi) {
                        setTimeout(() => { alert("Tebrikler! Tüm seriyi kusursuz eşleştirdiniz. 🏆"); }, 300);
                    }
                } else {
                    // Yanlış Eşleşme! Kartları hafifçe sarsıp seçimi temizleyebiliriz.
                    // Oyuncunun hatayı görmesi için yarım saniye sonra renk seçimlerini sıfırlıyoruz.
                    let k1 = secilenOnKart;
                    let k2 = secilenArkaKart;
                    setTimeout(() => {
                        k1.classList.remove('secildi');
                        k2.classList.remove('secildi');
                    }, 400);

                    secilenOnKart = null;
                    secilenArkaKart = null;
                }
            }
        }
    </script>

        <!--light mode-->
        <script>
            function light(){
                document.body.classList.toggle('light')
                document.getElementById('searcher').classList.toggle('dark')
            }
            document.getElementById('light-mode').addEventListener('contextmenu', (event)=>{
                event.preventDefault();
                let color= prompt('I dont know why you clicked that but now you get to chose the color'); 
                document.body.style.backgroundColor=color;
            })
        </script>
</body>
</html>
